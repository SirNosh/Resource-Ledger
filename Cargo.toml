[package]
name = "resource-ledger"
version = "0.4.0"
edition = "2024"
description = "A shared, advisory resource ledger (GPU memory, RAM, CPUs) for the coding-agent sessions on one machine"
repository = "https://github.com/SirNosh/Resource-Ledger"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_DXCore",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
